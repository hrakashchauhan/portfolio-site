<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  :root{
    --bg:#FAF8F4; --ink:#1B1A17; --soft:#57534A; --rule:#E5E1D8; --accent:#9A3412;
    --live:#1F6B4A; --live-bg:#E7F1EB; --shipped:#3A4A6B; --shipped-bg:#E9EDF4; --killed:#9A3412; --killed-bg:#F4E9E2;
    --display:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;grid-template-columns:1fr 372px}
  .main{padding:0 0 0 84px;display:flex;flex-direction:column;justify-content:center}
  .ey{font-family:var(--mono);font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:500;margin-bottom:24px}
  h1{font-family:var(--display);font-variation-settings:'opsz' 72,'SOFT' 0,'WONK' 0;font-size:68px;font-weight:600;line-height:1.02;letter-spacing:-.018em;max-width:13ch}
  h1 .ac{color:var(--accent)}
  .ledger{margin-top:38px;border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:4px 0}
  .row{display:flex;align-items:center;gap:18px;padding:13px 0}
  .row+.row{border-top:1px solid var(--rule)}
  .tag{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:5px;white-space:nowrap}
  .tag.live{color:var(--live);background:var(--live-bg)}
  .tag.killed{color:var(--killed);background:var(--killed-bg)}
  .tag.shipped{color:var(--shipped);background:var(--shipped-bg)}
  .row .t{font-family:var(--display);font-variation-settings:'opsz' 72;font-size:25px;font-weight:600}
  .row .t span{font-family:var(--sans);color:var(--soft);font-weight:400;font-size:21px}
  .foot{font-family:var(--mono);font-size:18px;color:var(--soft);margin-top:32px}
  .foot b{color:var(--ink);font-weight:500}
  .side{position:relative;border-left:1px solid var(--rule);display:flex;align-items:center;justify-content:center;background:#fff}
  .side img{width:262px;height:262px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
</style>
</head>
<body>
  <div class="main">
    <div class="ey">Operator · technically-literate · building toward PM</div>
    <h1>I turn unclear ideas into <span class="ac">execution.</span></h1>
    <div class="ledger">
      <div class="row"><span class="tag live">● Live</span><span class="t">One Source Intl. <span>— Founder's Office</span></span></div>
      <div class="row"><span class="tag killed">✕ Killed</span><span class="t">Jeevan Jhola <span>— shut it down on purpose</span></span></div>
      <div class="row"><span class="tag shipped">✓ Shipped</span><span class="t">Best Innovative Game <span>— Global Game Jam</span></span></div>
    </div>
    <div class="foot"><b>hrakashchauhan@gmail.com</b> &nbsp;·&nbsp; Ernakulam, Kerala &nbsp;·&nbsp; available now</div>
  </div>
  <div class="side">
    <img src="../../assets/akash.jpg" alt="">
  </div>
</body>
</html>
