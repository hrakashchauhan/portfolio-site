<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  :root{
    --bg:#0F0D0A; --ink:#F4EFE4; --soft:#A89F8D; --faint:#837B6D; --hairline:#2A251D; --accent:#F2B63C;
    --live:#46C172; --killed:#FF5A47;
    --display:'Bricolage Grotesque',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;grid-template-columns:1fr 360px}
  .main{padding:0 0 0 84px;display:flex;flex-direction:column;justify-content:center}
  .ey{font-family:var(--mono);font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);font-weight:500;margin-bottom:28px}
  .ey .ar{color:var(--accent)}
  h1{font-family:var(--display);font-size:67px;font-weight:800;line-height:.97;letter-spacing:-.02em;text-transform:uppercase;max-width:11ch}
  h1 .exec{display:inline-block;border-bottom:6px solid var(--accent);padding-bottom:2px}
  h1 .caret{color:var(--accent)}
  .ledger{margin-top:38px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
  .row{display:flex;align-items:center;gap:18px;padding:13px 0}
  .row+.row{border-top:1px solid var(--hairline)}
  .tag{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:6px 13px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .tag.live{color:var(--live);background:rgba(70,193,114,.13)}
  .tag.killed{color:var(--killed);background:rgba(255,90,71,.12)}
  .tag.shipped{color:var(--ink);background:rgba(244,239,228,.10)}
  .row .t{font-family:var(--display);font-size:25px;font-weight:650}
  .row .t span{font-family:var(--sans);color:var(--soft);font-weight:400;font-size:19px}
  .foot{font-family:var(--mono);font-size:17px;color:var(--faint);margin-top:32px;letter-spacing:.06em}
  .foot b{color:var(--accent);font-weight:500}
  .side{position:relative;border-left:1px solid var(--hairline);display:flex;align-items:center;justify-content:center}
  .photo{position:relative}
  .photo img{display:block;width:240px;height:240px;object-fit:cover;border-radius:8px;filter:grayscale(1) contrast(1.05)}
  .photo .cap{font-family:var(--mono);font-size:13px;color:var(--faint);text-align:left;padding-top:12px;letter-spacing:.18em}
  .tick{position:absolute;width:13px;height:13px;border:0 solid var(--faint)}
  .t-tl{top:-8px;left:-8px;border-top-width:1px;border-left-width:1px}
  .t-tr{top:-8px;right:-8px;border-top-width:1px;border-right-width:1px}
  .t-bl{bottom:30px;left:-8px;border-bottom-width:1px;border-left-width:1px}
  .t-br{bottom:30px;right:-8px;border-bottom-width:1px;border-right-width:1px}
</style>
</head>
<body>
  <div class="main">
    <div class="ey">Operations &amp; execution <span class="ar">→</span> project management</div>
    <h1>I turn unclear ideas into <span class="exec">execution</span><span class="caret">_</span></h1>
    <div class="ledger">
      <div class="row"><span class="tag live">● Live</span><span class="t">One Source Intl. <span>— Founder's Office</span></span></div>
      <div class="row"><span class="tag killed">✕ Killed</span><span class="t">Jeevan Jhola <span>— shut it down on purpose</span></span></div>
      <div class="row"><span class="tag shipped">✓ Shipped</span><span class="t">Best Innovative Game <span>— Global Game Jam</span></span></div>
    </div>
    <div class="foot"><b>hrakashchauhan@gmail.com</b> &nbsp;·&nbsp; Ernakulam, Kerala &nbsp;·&nbsp; available now</div>
  </div>
  <div class="side">
    <figure class="photo">
      <span class="tick t-tl"></span><span class="tick t-tr"></span><span class="tick t-bl"></span><span class="tick t-br"></span>
      <img src="../../assets/akash.jpg" alt="">
      <figcaption class="cap">ME, LATELY</figcaption>
    </figure>
  </div>
</body>
</html>
