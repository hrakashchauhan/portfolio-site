<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  :root{
    --bg:#FBFBFA; --ink:#16181D; --soft:#4A4F59; --rule:#E3E3E0; --accent:#1B4DFF;
    --live:#0B7A4B; --live-bg:#E6F4EC; --shipped:#1B4DFF; --shipped-bg:#E8EDFF; --killed:#B23A1E; --killed-bg:#FBEAE4;
    --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;grid-template-columns:1fr 360px}
  .main{padding:0 0 0 80px;display:flex;flex-direction:column;justify-content:center}
  .ey{font-family:var(--mono);font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:24px}
  h1{font-size:64px;font-weight:800;line-height:1.0;letter-spacing:-.03em;max-width:13ch}
  h1 .ac{color:var(--accent)}
  .ledger{margin-top:36px;border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:6px 0}
  .row{display:flex;align-items:center;gap:18px;padding:12px 0}
  .row+.row{border-top:1px solid var(--rule)}
  .tag{font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:6px 11px;border-radius:6px;white-space:nowrap}
  .tag.live{color:var(--live);background:var(--live-bg)}
  .tag.killed{color:var(--killed);background:var(--killed-bg)}
  .tag.shipped{color:var(--shipped);background:var(--shipped-bg)}
  .row .t{font-size:23px;font-weight:600}
  .row .t span{color:var(--soft);font-weight:400}
  .foot{font-family:var(--mono);font-size:19px;color:var(--soft);margin-top:30px}
  .foot b{color:var(--ink);font-weight:500}
  .side{position:relative;border-left:1px solid var(--rule);display:flex;align-items:center;justify-content:center}
  .side img{width:250px;height:250px;object-fit:cover;border-radius:16px;border:1px solid var(--rule)}
</style>
</head>
<body>
  <div class="main">
    <div class="ey">Akash Kumar — operator → PM</div>
    <h1>I turn unclear ideas into <span class="ac">execution.</span></h1>
    <div class="ledger">
      <div class="row"><span class="tag live">● Live</span><span class="t">Founder's Office <span>— One Source Intl.</span></span></div>
      <div class="row"><span class="tag killed">✕ Killed</span><span class="t">Jeevan Jhola <span>— shut it down on purpose</span></span></div>
      <div class="row"><span class="tag shipped">✓ Shipped</span><span class="t">NLP models · Python <span>— IIIT Kottayam</span></span></div>
    </div>
    <div class="foot"><b>hrakashchauhan@gmail.com</b> &nbsp;·&nbsp; Kerala, India &nbsp;·&nbsp; available now</div>
  </div>
  <div class="side">
    <img src="../../assets/akash.jpg" alt="">
  </div>
</body>
</html>
